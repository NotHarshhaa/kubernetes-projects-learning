# Complements allow-frontend.yaml: with default-deny applied, the database now only
# accepts connections from backend pods on port 5432 (PostgreSQL).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-database
spec:
  podSelector:
    matchLabels:
      app: database                # policy applies to the DATABASE pods
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: backend             # only BACKEND pods may connect
    ports:
    - protocol: TCP
      port: 5432
