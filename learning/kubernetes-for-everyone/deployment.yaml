# Deployment — the most common way to run stateless apps.
# Creates a ReplicaSet, which in turn creates and manages the 3 nginx Pods.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx                   # must match .spec.template.metadata.labels
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine   # small, maintained image (was nginx:1.7.9)
        ports:
        - containerPort: 80
