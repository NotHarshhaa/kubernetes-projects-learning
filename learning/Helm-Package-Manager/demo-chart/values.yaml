# Default values for demo-app.
# Values can be overridden per-release: --set, --values or -f (see README).

replicaCount: 2

image:
  repository: nginx
  tag: 1.25-alpine
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

labels:
  app: demo-app
