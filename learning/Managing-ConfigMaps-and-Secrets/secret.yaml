# A generic Secret for database credentials.
#
# IMPORTANT: stringData values are written in plain text here — the API server
# stores them base64-ENCODED (not encrypted) and `kubectl get secret -o yaml`
# returns them base64-DECODED to anyone with read access. Real protection comes
# from RBAC + encryption-at-rest + an external secret store (Vault, External
# Secrets Operator, Sealed Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
type: Opaque
stringData:                    # plain text — k8s base64-encodes it for you
  username: myuser
  password: mypassword
# type: kubernetes.io/tls is another common type for cert/key pairs:
# tls.crt / tls.key
