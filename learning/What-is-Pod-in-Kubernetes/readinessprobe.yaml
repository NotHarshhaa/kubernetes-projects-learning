# Readiness probe — a complete, runnable Pod.
#
# A failing readinessProbe does NOT restart the container; it only removes the Pod
# from Service endpoints (no traffic routed to it) until the probe passes again.
apiVersion: v1
kind: Pod
metadata:
  name: hello-world-readiness
  labels:
    app: hello
spec:
  containers:
  - name: hello-world-container
    image: busybox:1.36
    command: ['sh', '-c', 'while true; do printf "HTTP/1.1 200 OK\r\n\r\n" | nc -l -p 8080; done']
    ports:
    - name: http                 # named port — probes can reference it as "port: http"
      containerPort: 8080
    readinessProbe:
      httpGet:
        path: /healthz
        port: http
      initialDelaySeconds: 5    # start probing quickly — this gates Service traffic
      periodSeconds: 15
      failureThreshold: 6       # 6 consecutive failures => Pod marked NotReady
